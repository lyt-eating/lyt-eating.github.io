<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吵架记录 </title>
    <style>
        /* 全局重置与基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", "幼圆", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #FFE6F2 0%, #E6F7FF 100%);
            color: #333;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* 三丽鸥核心配色 */
        :root {
            /* Hello Kitty 粉系 */
            --kitty-primary: #FFC0CB;
            --kitty-secondary: #E6007E;
            --kitty-light: #FFE6EF;
            --kitty-deep: #FF8FA3;
            --kitty-border: #FFB6C1;
            
            /* 玉桂狗 蓝系 */
            --cinnamon-primary: #B8E0F8;
            --cinnamon-secondary: #4A90E2;
            --cinnamon-light: #E6F7FF;
            --cinnamon-deep: #87CEEB;
            --cinnamon-border: #ADD8E6;
            
            /* 通用可爱样式 */
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 28px;
            --shadow-sm: 0 2px 8px rgba(255,192,203,0.2);
            --shadow-md: 0 5px 15px rgba(255,192,203,0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 导航栏 */
        nav {
            display: flex;
            padding: 15px 20px;
            gap: 15px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            background: white;
            border-bottom: 3px solid var(--kitty-primary);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
            margin-bottom: 20px;
        }
        nav a {
            text-decoration: none;
            color: #333;
            font-size: 15px;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            position: relative;
            transition: var(--transition);
        }
        nav a.active {
            background: var(--kitty-light);
            color: var(--kitty-secondary);
            font-weight: bold;
            box-shadow: inset 0 0 0 2px var(--kitty-border);
        }
        nav a:hover {
            background: var(--kitty-light);
            transform: translateY(-2px);
        }
        nav a::after {
            content: "🎀";
            font-size: 10px;
            position: absolute;
            right: -6px;
            top: -4px;
            opacity: 0;
            transition: var(--transition);
        }
        nav a:hover::after {
            opacity: 1;
            right: -8px;
        }

        /* 图片上传按钮 */
        .upload-buttons {
            text-align: center;
            margin: 15px 0;
            padding: 0 20px;
        }
        .upload-btn {
            margin: 0 10px;
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
            transition: var(--transition);
            background: var(--kitty-primary);
            color: var(--kitty-secondary);
            font-weight: bold;
        }
        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            background: var(--kitty-secondary);
            color: white;
        }

        /* Banner区域 */
        .banner {
            max-width: 1100px;
            margin: 0 auto 30px;
            padding: 0 20px;
        }
        .banner-inner {
            height: 180px;
            background: no-repeat center; /* 本地图片上传填充 */
            background-size: cover;
            border-radius: var(--radius-lg);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            border: 3px solid white;
        }
        .banner-inner::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, rgba(255,204,214,0.8), rgba(184,224,248,0.8));
        }
        .banner-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            text-align: center;
            padding: 0 20px;
        }
        .banner-content h1 {
            color: var(--kitty-secondary);
            font-size: 26px;
            margin-bottom: 8px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .banner-content h1::before, .banner-content h1::after {
            content: "💢"; /* 生气图标适配吵架主题 */
            font-size: 20px;
        }
        .banner-content p {
            color: #666;
            font-size: 15px;
            background: rgba(255,255,255,0.9);
            padding: 5px 15px;
            border-radius: var(--radius-sm);
            display: inline-block;
        }

        /* 主容器 */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            gap: 30px;
        }

        /* 吵架记录板块 */
        .quarrel-section {
            background: white;
            border-radius: var(--radius-lg);
            padding: 30px;
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
            transition: var(--transition);
            border-top: 8px solid var(--kitty-primary);
            border-left: 8px solid var(--kitty-primary);
        }
        .quarrel-section:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-3px);
        }
        .quarrel-section::before {
            content: '';
            position: absolute;
            top: -30px;
            right: -30px;
            width: 200px;
            height: 200px;
            background: no-repeat center; /* 本地装饰图 */
            background-size: cover;
            border-radius: 50%;
            opacity: 1;
            z-index: 1;
        }
        .quarrel-section::after {
            content: '💢';
            position: absolute;
            bottom: 10px;
            right: 20px;
            font-size: 60px;
            opacity: 0.08;
            z-index: 1;
        }

        /* 板块标题 */
        .quarrel-title {
            font-size: 24px;
            margin: 0 0 25px;
            color: var(--kitty-secondary);
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 3px dotted var(--kitty-primary);
            position: relative;
            z-index: 2;
        }
        .quarrel-title::before {
            content: "📝💢";
            font-size: 28px;
        }

        /* 功能按钮组 */
        .func-btn-group {
            display: flex;
            gap: 12px;
            margin: 15px 0;
            flex-wrap: wrap;
            position: relative;
            z-index: 2;
        }
        .add-record-btn, .clear-btn, .filter-btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            box-shadow: var(--shadow-sm);
        }
        .add-record-btn {
            background: var(--kitty-primary);
            color: var(--kitty-secondary);
        }
        .add-record-btn:hover {
            background: var(--kitty-deep);
            color: white;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .clear-btn {
            background: white;
            color: #FF6B8B;
            border: 2px solid #FFF0F5;
        }
        .clear-btn:hover {
            background: #FFF0F5;
            transform: translateY(-2px);
        }
        .filter-btn {
            background: var(--cinnamon-primary);
            color: var(--cinnamon-secondary);
        }
        .filter-btn:hover {
            background: var(--cinnamon-deep);
            color: white;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* 新增吵架记录表单 */
        .quarrel-form {
            background: var(--kitty-light);
            border-radius: var(--radius-md);
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow-sm);
            display: none;
            position: relative;
            z-index: 2;
            border: 2px solid var(--kitty-border);
        }
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .form-item {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
        }
        .form-item label {
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--kitty-secondary);
        }
        .form-item input, .form-item select, .form-item textarea {
            padding: 12px 15px;
            border: 2px solid var(--kitty-light);
            border-radius: var(--radius-sm);
            outline: none;
            font-size: 14px;
            transition: var(--transition);
            background: white;
        }
        .form-item input:focus, .form-item select:focus, .form-item textarea:focus {
            border-color: var(--kitty-secondary);
            box-shadow: 0 0 0 3px rgba(230,0,126,0.1);
        }
        .form-item textarea {
            resize: vertical;
            min-height: 120px;
            line-height: 1.6;
            width: 100%;
        }
        .submit-record-btn {
            padding: 12px 25px;
            border: none;
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
            background: var(--kitty-secondary);
            color: white;
        }
        .submit-record-btn:hover {
            background: #C5006C;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* 吵架记录列表 */
        .quarrel-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin: 20px 0;
            position: relative;
            z-index: 2;
        }
        /* 记录卡片 */
        .quarrel-card {
            background: white;
            border-radius: var(--radius-md);
            padding: 22px;
            box-shadow: var(--shadow-sm);
            border-left: 4px solid var(--kitty-primary);
            transition: var(--transition);
            position: relative;
        }
        .quarrel-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
            border-left-color: var(--kitty-secondary);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px dotted var(--kitty-light);
        }
        .card-date {
            font-size: 12px;
            color: #999;
            background: var(--kitty-light);
            padding: 4px 10px;
            border-radius: var(--radius-sm);
        }
        .card-tag {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            color: white;
        }
        .tag-minor {
            background: var(--cinnamon-primary);
        }
        .tag-major {
            background: var(--kitty-primary);
        }
        .tag-serious {
            background: var(--kitty-secondary);
        }
        .card-title {
            font-size: 18px;
            margin-bottom: 10px;
            color: var(--kitty-secondary);
            font-weight: bold;
        }
        .card-content {
            font-size: 14px;
            line-height: 1.6;
            color: #666;
            margin-bottom: 12px;
        }
        .card-handle {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .edit-btn, .delete-btn {
            padding: 6px 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
        }
        .edit-btn {
            background: var(--cinnamon-light);
            color: var(--cinnamon-secondary);
        }
        .edit-btn:hover {
            background: var(--cinnamon-primary);
        }
        .delete-btn {
            background: #FFF0F5;
            color: #FF6B8B;
        }
        .delete-btn:hover {
            background: #FFE6EF;
        }

        /* 空状态提示 */
        .empty-tip {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 16px;
            position: relative;
            z-index: 2;
        }
        .empty-tip::before {
            content: "😶";
            font-size: 40px;
            display: block;
            margin-bottom: 15px;
        }
    </style>
    <!-- 引入LeanCloud SDK -->
    <script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.13.0/dist/av-min.js"></script>
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <a href="shouye.html">首页</a>
        <a href="hobbies.html">喜欢与不喜欢</a>
        <a href="quarrel.html" class="active">吵架记录</a>
        <a href="anniversary.html">纪念日</a>
        <a href="sweet-moments.html">甜蜜瞬间</a>
    </nav>

    <!-- 图片上传按钮 -->
    <div class="upload-buttons">
        <label for="bannerImg" class="upload-btn">
            上传Banner背景图 🖼️
        </label>
        <input type="file" id="bannerImg" accept="image/*" style="display: none;">

        <label for="decorImg" class="upload-btn">
            上传装饰图 🎀
        </label>
        <input type="file" id="decorImg" accept="image/*" style="display: none;">
    </div>

    <!-- Banner区域 -->
    <div class="banner">
        <div class="banner-inner">
            <div class="banner-content">
                <h1>吵架小记录</h1>
                <p>记录每一次的小情绪，也记得和好的甜蜜 💖</p>
            </div>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="container">
        <!-- 吵架记录板块 -->
        <div class="quarrel-section">
            <h2 class="quarrel-title">吵架记录簿</h2>

            <!-- 功能按钮组 -->
            <div class="func-btn-group">
                <button class="add-record-btn">
                    📝 新增吵架记录
                </button>
                <button class="filter-btn">
                    🔍 按类型筛选
                </button>
                <button class="clear-btn">
                    🗑️ 清空已解决记录
                </button>
            </div>

            <!-- 新增吵架记录表单 -->
            <div class="quarrel-form">
                <div class="form-row">
                    <div class="form-item">
                        <label for="quarrel-date">吵架日期</label>
                        <input type="date" id="quarrel-date" required>
                    </div>
                    <div class="form-item">
                        <label for="quarrel-level">吵架程度</label>
                        <select id="quarrel-level" required>
                            <option value="">请选择</option>
                            <option value="minor">小吵（拌嘴）</option>
                            <option value="major">中吵（生气）</option>
                            <option value="serious">大吵（冷战）</option>
                        </select>
                    </div>
                </div>
                <div class="form-item">
                    <label for="quarrel-title">吵架主题</label>
                    <input type="text" id="quarrel-title" placeholder="比如：忘记回复消息..." required>
                </div>
                <div class="form-item">
                    <label for="quarrel-content">吵架经过 & 原因</label>
                    <textarea id="quarrel-content" placeholder="详细描述一下吵架的经过、原因，以及后来怎么和好的..." required></textarea>
                </div>
                <div class="form-item">
                    <label for="quarrel-solve">是否和好</label>
                    <select id="quarrel-solve" required>
                        <option value="yes">已和好 ✨</option>
                        <option value="no">未和好 😔</option>
                    </select>
                </div>
                <button class="submit-record-btn">保存记录</button>
            </div>

            <!-- 吵架记录列表 -->
            <div class="quarrel-list">
                <!-- 空状态提示 -->
                <div class="empty-tip">
                    还没有吵架记录哦～
                    <br>希望一直都没有 💓
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== 1. 初始化LeanCloud（唯一且正确） ==========
        AV.init({
            appId: "kxZrkCIhQd1pIG6msvlJKq1t-gzGzoHsz",
            appKey: "SeEl1FGOeyZ1prvbwPOWakUU",
            serverURL: "https://kxzrkcih.lc-cn-n1-shared.com"
        });
        // 定义LeanCloud数据表
        const QuarrelRecord = AV.Object.extend('QuarrelRecord');

        // ========== 2. 本地存储工具函数（兜底） ==========
        function saveToStorage(key, data) {
            localStorage.setItem(key, JSON.stringify(data));
        }
        function getFromStorage(key) {
            const data = localStorage.getItem(key);
            return data ? JSON.parse(data) : [];
        }

        // ========== 3. 云端操作函数（优化错误处理） ==========
        // 拉取云端记录（失败时静默降级到本地）
        async function fetchQuarrelRecordsFromCloud() {
            try {
                const query = new AV.Query('QuarrelRecord');
                query.descending('createdAt'); // 最新的在前
                const results = await query.find();
                const records = results.map(record => ({
                    id: record.id,
                    date: record.get('date'),
                    level: record.get('level'),
                    title: record.get('title'),
                    content: record.get('content'),
                    solve: record.get('solve')
                }));
                // 拉取成功，同步到本地
                saveToStorage('quarrel_records', records);
                return records;
            } catch (error) {
                // 仅控制台提示，不弹框
                console.warn('云端拉取失败，使用本地记录：', error.message);
                return getFromStorage('quarrel_records');
            }
        }

        // 保存/编辑云端记录（失败时仅控制台提示）
        async function saveQuarrelRecordToCloud(record, isEdit = false, cloudId = '') {
            try {
                let quarrelRecord;
                if (isEdit) {
                    quarrelRecord = AV.Object.createWithoutData('QuarrelRecord', cloudId);
                } else {
                    quarrelRecord = new QuarrelRecord();
                }
                quarrelRecord.set('date', record.date);
                quarrelRecord.set('level', record.level);
                quarrelRecord.set('title', record.title);
                quarrelRecord.set('content', record.content);
                quarrelRecord.set('solve', record.solve);
                const savedRecord = await quarrelRecord.save();
                return savedRecord.id;
            } catch (error) {
                console.warn('云端保存失败：', error.message);
                return null;
            }
        }

        // 删除云端记录（失败时仅控制台提示）
        async function deleteQuarrelRecordFromCloud(cloudId) {
            try {
                const quarrelRecord = AV.Object.createWithoutData('QuarrelRecord', cloudId);
                await quarrelRecord.destroy();
                return true;
            } catch (error) {
                console.warn('云端删除失败：', error.message);
                return false;
            }
        }

        // 清空云端已解决记录（失败时仅控制台提示）
        async function clearSolvedRecordsFromCloud() {
            try {
                const query = new AV.Query('QuarrelRecord');
                query.equalTo('solve', 'yes');
                const results = await query.find();
                await AV.Object.destroyAll(results);
                return true;
            } catch (error) {
                console.warn('云端清空失败：', error.message);
                return false;
            }
        }

        // ========== 4. Banner/装饰图上传逻辑 ==========
        const banner = document.querySelector('.banner-inner');
        // 恢复Banner背景
        const savedBannerImg = getFromStorage('quarrel_banner_img');
        if (savedBannerImg) {
            banner.style.backgroundImage = `url("${savedBannerImg}")`;
        }
        // 上传Banner
        document.getElementById('bannerImg').addEventListener('change', function(e) {
            if (e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const imgBase64 = event.target.result;
                    banner.style.backgroundImage = `url("${imgBase64}")`;
                    saveToStorage('quarrel_banner_img', imgBase64);
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        // 恢复装饰图
        let decorStyleTag = null;
        const savedDecorImg = getFromStorage('quarrel_decor_img');
        if (savedDecorImg) {
            decorStyleTag = document.createElement('style');
            decorStyleTag.textContent = `
                .quarrel-section::before {
                    background-image: url("${savedDecorImg}") !important;
                }
            `;
            document.head.appendChild(decorStyleTag);
        }
        // 上传装饰图
        document.getElementById('decorImg').addEventListener('change', function(e) {
            if (e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const imgBase64 = event.target.result;
                    if (decorStyleTag) {
                        decorStyleTag.textContent = `
                            .quarrel-section::before {
                                background-image: url("${imgBase64}") !important;
                            }
                        `;
                    } else {
                        decorStyleTag = document.createElement('style');
                        decorStyleTag.textContent = `
                            .quarrel-section::before {
                                background-image: url("${imgBase64}") !important;
                            }
                        `;
                        document.head.appendChild(decorStyleTag);
                    }
                    saveToStorage('quarrel_decor_img', imgBase64);
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        // ========== 5. 吵架记录核心逻辑（云端优先+本地兜底） ==========
        const form = document.querySelector('.quarrel-form');
        const list = document.querySelector('.quarrel-list');
        const addBtn = document.querySelector('.add-record-btn');
        const submitBtn = document.querySelector('.submit-record-btn');
        const clearBtn = document.querySelector('.clear-btn');
        const filterBtn = document.querySelector('.filter-btn');

        let quarrelRecords = [];

        // 初始化：优先拉取云端
        async function initQuarrelRecords() {
            quarrelRecords = await fetchQuarrelRecordsFromCloud();
            renderRecords();
        }

        // 渲染记录列表
        function renderRecords(records = quarrelRecords) {
            list.innerHTML = '';
            if (records.length === 0) {
                list.innerHTML = `
                    <div class="empty-tip">
                        还没有吵架记录哦～
                        <br>希望一直都没有 💓
                    </div>
                `;
                return;
            }
            records.forEach((record, index) => {
                // 生成标签样式
                let tagClass = '';
                let tagText = '';
                switch(record.level) {
                    case 'minor':
                        tagClass = 'tag-minor';
                        tagText = '小吵';
                        break;
                    case 'major':
                        tagClass = 'tag-major';
                        tagText = '中吵';
                        break;
                    case 'serious':
                        tagClass = 'tag-serious';
                        tagText = '大吵';
                        break;
                }
                const solveText = record.solve === 'yes' ? '已和好 ✨' : '未和好 😔';

                // 创建卡片
                const card = document.createElement('div');
                card.className = 'quarrel-card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-date">${record.date}</span>
                        <span class="card-tag ${tagClass}">${tagText}</span>
                    </div>
                    <h3 class="card-title">${record.title}</h3>
                    <div class="card-content">${record.content}</div>
                    <div class="card-content" style="font-size:12px;color:#999;">${solveText}</div>
                    <div class="card-handle">
                        <button class="edit-btn" data-index="${index}">编辑</button>
                        <button class="delete-btn" data-index="${index}">删除</button>
                    </div>
                `;
                list.appendChild(card);

                // 编辑按钮
                card.querySelector('.edit-btn').addEventListener('click', function() {
                    const idx = this.dataset.index;
                    const editRecord = quarrelRecords[idx];
                    // 填充表单
                    document.getElementById('quarrel-date').value = editRecord.date;
                    document.getElementById('quarrel-level').value = editRecord.level;
                    document.getElementById('quarrel-title').value = editRecord.title;
                    document.getElementById('quarrel-content').value = editRecord.content;
                    document.getElementById('quarrel-solve').value = editRecord.solve;
                    // 标记编辑信息
                    submitBtn.dataset.editIndex = idx;
                    submitBtn.dataset.cloudId = editRecord.id;
                    // 显示表单
                    form.style.display = 'block';
                });

                // 删除按钮
                card.querySelector('.delete-btn').addEventListener('click', async function() {
                    if (confirm('确定要删除这条记录吗？')) {
                        const idx = this.dataset.index;
                        const cloudId = quarrelRecords[idx].id;
                        // 优先删除云端
                        await deleteQuarrelRecordFromCloud(cloudId);
                        // 再删除本地
                        quarrelRecords.splice(idx, 1);
                        saveToStorage('quarrel_records', quarrelRecords);
                        renderRecords();
                    }
                });
            });
        }

        // 新增/编辑记录提交
        submitBtn.addEventListener('click', async function() {
            // 获取表单值
            const date = document.getElementById('quarrel-date').value;
            const level = document.getElementById('quarrel-level').value;
            const title = document.getElementById('quarrel-title').value;
            const content = document.getElementById('quarrel-content').value;
            const solve = document.getElementById('quarrel-solve').value;

            // 表单验证
            if (!date || !level || !title || !content || !solve) {
                alert('请填写完整的记录信息哦～');
                return;
            }

            const newRecord = { date, level, title, content, solve };
            let cloudId = null;

            // 编辑模式
            if (this.dataset.editIndex !== undefined) {
                const idx = this.dataset.editIndex;
                cloudId = this.dataset.cloudId;
                // 优先保存到云端
                await saveQuarrelRecordToCloud(newRecord, true, cloudId);
                // 更新本地（保留云端ID）
                newRecord.id = cloudId;
                quarrelRecords[idx] = newRecord;
                // 清空编辑标记
                delete this.dataset.editIndex;
                delete this.dataset.cloudId;
            } else {
                // 新增模式
                // 优先保存到云端
                cloudId = await saveQuarrelRecordToCloud(newRecord);
                // 本地ID兜底
                newRecord.id = cloudId || `local_${Date.now()}`;
                quarrelRecords.push(newRecord);
            }

            // 同步到本地存储
            saveToStorage('quarrel_records', quarrelRecords);
            // 重新渲染
            renderRecords();
            // 重置表单
            form.reset();
            form.style.display = 'none';
        });

        // 清空已解决记录
        clearBtn.addEventListener('click', async function() {
            if (confirm('确定要清空所有已解决的吵架记录吗？')) {
                // 优先清空云端
                await clearSolvedRecordsFromCloud();
                // 再过滤本地
                quarrelRecords = quarrelRecords.filter(record => record.solve !== 'yes');
                saveToStorage('quarrel_records', quarrelRecords);
                renderRecords();
            }
        });

        // 筛选功能
        filterBtn.addEventListener('click', function() {
            const filterType = prompt('请输入要筛选的类型：\n1. 小吵\n2. 中吵\n3. 大吵\n4. 已和好\n5. 未和好');
            if (!filterType) return;

            if (quarrelRecords.length === 0) {
                alert('暂无记录可筛选～');
                return;
            }

            let filteredRecords = [];
            switch(filterType) {
                case '1':
                    filteredRecords = quarrelRecords.filter(r => r.level === 'minor');
                    break;
                case '2':
                    filteredRecords = quarrelRecords.filter(r => r.level === 'major');
                    break;
                case '3':
                    filteredRecords = quarrelRecords.filter(r => r.level === 'serious');
                    break;
                case '4':
                    filteredRecords = quarrelRecords.filter(r => r.solve === 'yes');
                    break;
                case '5':
                    filteredRecords = quarrelRecords.filter(r => r.solve === 'no');
                    break;
                default:
                    alert('输入的类型不正确哦～');
                    return;
            }
            renderRecords(filteredRecords);
        });

        // 新增按钮点击事件
        addBtn.addEventListener('click', function() {
            form.style.display = form.style.display === 'block' ? 'none' : 'block';
            delete submitBtn.dataset.editIndex;
            delete submitBtn.dataset.cloudId;
            // 自动填充今日日期
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('quarrel-date').value = today;
            form.reset();
        });

        // 页面加载初始化
        window.onload = async function() {
            await initQuarrelRecords();
        };
    </script>
</body>
</html>
